[program:wap]
command=/home/erdos1/WABot/venv/bin/python -m uvicorn src.server:app --host 0.0.0.0 --port 3001
directory=/home/erdos1/WABot/wap
user=erdos1
autostart=true
autorestart=true
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/home/erdos1/WABot/logs/wap_out.log
stderr_logfile=/home/erdos1/WABot/logs/wap_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
stopsignal=TERM
stopasgroup=true
killasgroup=true
